name: Android CI

on:
  push:
    branches: [ main, feature/native-compose-v2, feature/modern-momo-v3, feature/mobile-editing-v24 ]
  pull_request:
    branches: [ main, feature/mobile-editing-v24 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MietMoments-2.3.1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MietMoments-2.3.1-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Prepare Android signing tool
        run: |
          mkdir -p signing-tool
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          cp "$BT/lib/apksigner.jar" signing-tool/
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: signing-tool/apksigner.jar
          if-no-files-found: error
